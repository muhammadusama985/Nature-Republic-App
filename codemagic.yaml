# Codemagic CI/CD for the Nature Republic iOS app.
#
# Repository root: this folder (flutter_customer_app).
# If you later move the app into a monorepo, add:
#   working_directory: flutter_customer_app
# under the workflow.
#
# Before the first build:
#   1. Add the repository to Codemagic.
#   2. Add an App Store Connect integration in Codemagic and select it for
#      this app (the name is chosen in the Codemagic UI, not here).
#   3. Add CERTIFICATE_PRIVATE_KEY as a secret environment variable.
#   4. Create the app record in App Store Connect with bundle ID
#      ae.naturerepublic.app.
#
# See docs/appstore/submission-guide.md in the project workspace.

workflows:
  ios-release:
    name: iOS Release - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # This must match the App Store Connect API key name you create in
      # Codemagic (Team settings > Integrations > Developer Portal).
      # Rename either this value or the integration so they match.
      app_store_connect: nr_appstore
    environment:
      flutter: 3.38.1
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "ae.naturerepublic.app"
        APP_VERSION: "1.0.0"
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing certificate and provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificate to keychain
        script: |
          keychain add-certificates

      - name: Apply signing profiles to the Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads the build to App Store Connect / TestFlight.
        submit_to_testflight: true
        # Keep this false while you test the TestFlight build and finish the
        # App Store listing. Change it to true only when every field in
        # App Store Connect is complete and you are ready to submit for review.
        submit_to_app_store: false
